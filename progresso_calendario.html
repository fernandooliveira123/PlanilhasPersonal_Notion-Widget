<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Progresso do Tempo</title>

<style>

body{
background:#191919;
color:white;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.progress-container{
width:90%;
max-width:420px;
display:flex;
flex-direction:column;
gap:14px;
}

.progress-bar{
display:flex;
align-items:center;
justify-content:space-between;
border:2px solid white;
padding:6px;
border-radius:6px;
background:#222;
}

.progress-bar-inner{
height:28px;
background:#4caf50;
width:0%;
border-radius:4px;
transition:width .3s;
}

.progress-label{
margin-left:10px;
font-size:16px;
}

</style>
</head>

<body>

<div class="progress-container">

<div class="progress-bar">
<div class="progress-bar-inner" id="dayProgress"></div>
<div class="progress-label">Day: <span id="dayText">0%</span></div>
</div>

<div class="progress-bar">
<div class="progress-bar-inner" id="weekProgress"></div>
<div class="progress-label">Week: <span id="weekText">0%</span></div>
</div>

<div class="progress-bar">
<div class="progress-bar-inner" id="monthProgress"></div>
<div class="progress-label">Month: <span id="monthText">0%</span></div>
</div>

<div class="progress-bar">
<div class="progress-bar-inner" id="quarterProgress"></div>
<div class="progress-label">
<span id="quarterName">T1</span>: 
<span id="quarterText">0%</span>
</div>
</div>

<div class="progress-bar">
<div class="progress-bar-inner" id="yearProgress"></div>
<div class="progress-label">Year: <span id="yearText">0%</span></div>
</div>

</div>

<script>

function getDayProgress(){

const now=new Date()

const start=new Date(now)
start.setHours(0,0,0,0)

const end=new Date(now)
end.setHours(23,59,59,999)

return Math.round((Date.now()-start)/(end-start)*100)

}

function getWeekProgress(){

const today=new Date()

const start=new Date(today)
start.setDate(today.getDate()-today.getDay())
start.setHours(0,0,0,0)

const end=new Date(start)
end.setDate(start.getDate()+6)
end.setHours(23,59,59,999)

return Math.round((Date.now()-start)/(end-start)*100)

}

function getMonthProgress(){

const today=new Date()

const start=new Date(today.getFullYear(),today.getMonth(),1)
const end=new Date(today.getFullYear(),today.getMonth()+1,0,23,59,59,999)

return Math.round((Date.now()-start)/(end-start)*100)

}

function getQuarterInfo(){

const today=new Date()
const month=today.getMonth()

const quarter=Math.floor(month/3)

const names=[
"T1 (Jan–Mar)",
"T2 (Abr–Jun)",
"T3 (Jul–Set)",
"T4 (Out–Dez)"
]

const start=new Date(today.getFullYear(),quarter*3,1)
const end=new Date(today.getFullYear(),quarter*3+3,0,23,59,59,999)

const progress=Math.round((Date.now()-start)/(end-start)*100)

return{
name:names[quarter],
progress:progress
}

}

function getYearProgress(){

const today=new Date()

const start=new Date(today.getFullYear(),0,1)
const end=new Date(today.getFullYear(),11,31,23,59,59,999)

return Math.round((Date.now()-start)/(end-start)*100)

}

function update(){

const day=getDayProgress()
document.getElementById("dayProgress").style.width=day+"%"
document.getElementById("dayText").textContent=day+"%"

const week=getWeekProgress()
document.getElementById("weekProgress").style.width=week+"%"
document.getElementById("weekText").textContent=week+"%"

const month=getMonthProgress()
document.getElementById("monthProgress").style.width=month+"%"
document.getElementById("monthText").textContent=month+"%"

const quarter=getQuarterInfo()
document.getElementById("quarterProgress").style.width=quarter.progress+"%"
document.getElementById("quarterText").textContent=quarter.progress+"%"
document.getElementById("quarterName").textContent=quarter.name

const year=getYearProgress()
document.getElementById("yearProgress").style.width=year+"%"
document.getElementById("yearText").textContent=year+"%"

}

setInterval(update,1000)

update()

</script>

</body>
</html>
